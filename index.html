<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Gestão de Ferramentas — Complexo Penal de Marília</title>
  <meta name="description" content="Sistema de Gestão de Ferramentas e Estoque da Polícia Penal">

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: { 850: '#1e293b' }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    @media print {
      #sidebar, header, #sidebar-overlay, #login-screen, button[onclick*="export"], button[onclick*="print"] { display: none !important; }
      #main-content { padding: 0 !important; }
    }

    .login-bg {
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(80,80,80,0.35) 0%, transparent 70%),
        radial-gradient(ellipse 60% 80% at 70% 20%, rgba(45,45,45,0.4) 0%, transparent 65%),
        radial-gradient(ellipse 70% 50% at 50% 70%, rgba(30,30,30,0.5) 0%, transparent 60%),
        radial-gradient(ellipse 50% 70% at 85% 75%, rgba(60,60,60,0.3) 0%, transparent 65%),
        radial-gradient(ellipse 90% 40% at 10% 80%, rgba(40,40,40,0.35) 0%, transparent 70%),
        radial-gradient(ellipse 55% 55% at 45% 45%, rgba(20,20,20,0.45) 0%, transparent 60%),
        linear-gradient(160deg, #1a1a1a 0%, #0d0d0d 40%, #1f1f1f 70%, #0a0a0a 100%);
      background-blend-mode: normal, normal, normal, normal, normal, normal, normal;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="login-bg fixed inset-0 z-[100] flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <!-- Card Principal -->
      <div class="bg-white rounded-2xl shadow-2xl overflow-hidden fade-in">
        <!-- Header -->
        <div class="bg-slate-900 px-8 py-8 text-center relative">
          <div class="absolute top-0 left-0 w-full h-1 bg-amber-500"></div>
          <div class="w-16 h-16 rounded-xl bg-amber-500 flex items-center justify-center mx-auto mb-4 shadow-lg">
            <i class="fas fa-toolbox text-slate-900 text-2xl"></i>
          </div>
          <h1 class="text-xl font-bold text-white">Ferramentas & Estoque</h1>
          <p class="text-xs text-amber-400 uppercase tracking-wider mt-1 font-semibold">Complexo Penal de Marília</p>
          <p class="text-[10px] text-slate-400 mt-1">Polícia Penal — Núcleo de Infraestrutura e Logística</p>
        </div>

        <!-- Formulário -->
        <div class="px-8 py-6 space-y-4">
          <div id="login-error" class="hidden bg-red-50 border border-red-200 rounded-lg px-3 py-2 text-sm text-red-700 text-center"></div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Usuário</label>
            <div class="relative">
              <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input id="login-user" type="text" placeholder="Digite seu usuário"
                class="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition"
                onkeydown="if(event.key==='Enter')authModule.doLogin()">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Senha</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input id="login-pass" type="password" placeholder="Digite sua senha"
                class="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition"
                onkeydown="if(event.key==='Enter')authModule.doLogin()">
            </div>
          </div>

          <button onclick="authModule.doLogin()"
            class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold rounded-lg transition shadow-lg shadow-amber-500/20 text-sm">
            <i class="fas fa-sign-in-alt mr-2"></i>Entrar no Sistema
          </button>
        </div>

        <!-- Usuários Pré-cadastrados -->
        <div class="px-8 py-4 bg-slate-50 border-t border-slate-200">
          <p class="text-xs text-slate-500 text-center mb-3">Usuários pré-cadastrados — clique para preencher:</p>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="authModule.fillLogin('admin','admin123')" class="text-center p-2 rounded-lg border border-slate-200 hover:border-amber-500 hover:bg-amber-50 transition bg-white">
              <i class="fas fa-user-shield text-blue-700 text-sm mb-1"></i>
              <p class="text-[10px] font-bold text-slate-700">admin</p>
              <p class="text-[9px] text-slate-400">Admin</p>
            </button>
            <button onclick="authModule.fillLogin('oliveira','oliveira2026')" class="text-center p-2 rounded-lg border border-slate-200 hover:border-amber-500 hover:bg-amber-50 transition bg-white">
              <i class="fas fa-user text-green-600 text-sm mb-1"></i>
              <p class="text-[10px] font-bold text-slate-700">oliveira</p>
              <p class="text-[9px] text-slate-400">Operador</p>
            </button>
            <button onclick="authModule.fillLogin('souza','souza2026')" class="text-center p-2 rounded-lg border border-slate-200 hover:border-amber-500 hover:bg-amber-50 transition bg-white">
              <i class="fas fa-user text-green-600 text-sm mb-1"></i>
              <p class="text-[10px] font-bold text-slate-700">souza</p>
              <p class="text-[9px] text-slate-400">Operador</p>
            </button>
          </div>
        </div>

        <!-- Footer -->
        <div class="bg-slate-100 px-8 py-3 border-t border-slate-200 text-center flex items-center justify-between">
          <p class="text-[10px] text-slate-400">v2.4.0</p>
          <p class="text-[10px] text-slate-400">ZANONI & MARTINEZ InfraTech</p>
        </div>
      </div>
    </div>
  </div>

  <!-- APP CONTAINER -->
  <div id="app"></div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="estoque.js"></script>
  <script src="ferramentas.js"></script>
  <script src="indicadores.js"></script>
  <script src="app.js"></script>
</body>
</html>
