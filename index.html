<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Gestão de Ferramentas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/print.css">
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- Tela de Login -->
  <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-blue-900 to-slate-900">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm mx-4">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4 text-white text-2xl">
          <i class="fas fa-tools"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800">ERP Tools</h2>
        <p class="text-slate-500 text-sm mt-1">Complexo Penal de Marília · Núcleo de Infraestrutura e Logística</p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Usuário</label>
          <input id="loginUser" type="text" value="admin" 
            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
          <input id="loginPass" type="password" placeholder="Digite a senha"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <button onclick="app.login()" 
          class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition text-sm">
          Entrar
        </button>
        <p id="loginError" class="text-red-600 text-xs text-center hidden"></p>
      </div>
      <div class="mt-6 text-center text-xs text-slate-400">
        v2.1.0 · Google Sheets Edition
      </div>
    </div>
  </div>

  <!-- App Principal -->
  <div id="app" class="hidden min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col">
      <div class="p-5 border-b border-slate-100">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white">
            <i class="fas fa-tools"></i>
          </div>
          <div>
            <h1 class="font-bold text-slate-800 leading-tight">ERP Tools</h1>
            <p class="text-xs text-slate-500">Gestão de Ferramentas</p>
          </div>
        </div>
      </div>
      <nav class="flex-1 p-3 space-y-1">
        <a href="#" data-page="dashboard" class="nav-item active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition">
          <i class="fas fa-chart-pie w-5 text-center"></i> Dashboard
        </a>
        <a href="#" data-page="emprestimos" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition">
          <i class="fas fa-hand-holding w-5 text-center"></i> Empréstimos
        </a>
        <a href="#" data-page="estoque" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition">
          <i class="fas fa-boxes w-5 text-center"></i> Estoque
        </a>
        <a href="#" data-page="ferramentas" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition">
          <i class="fas fa-wrench w-5 text-center"></i> Ferramentas
        </a>
        <a button onclick="app.navigate('relatorios')" data-page="relatorios"
          class="w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
    Relatórios
</button>
        </a>
        <a href="#" data-page="historico" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition">
          <i class="fas fa-clipboard-list w-5 text-center"></i> Histórico
        </a>
      </nav>
      <div class="p-4 border-t border-slate-100">
        <div id="userInfo" class="flex items-center justify-between text-sm text-slate-600"></div>
      </div>
    </aside>

    <!-- Conteúdo -->
    <main class="flex-1 flex flex-col min-w-0">
      <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <h2 id="pageTitle" class="text-xl font-bold text-slate-800">Dashboard</h2>
          <span id="syncStatus" class="text-xs px-2 py-1 rounded-full bg-green-100 text-green-700 font-medium hidden">
            <i class="fas fa-check-circle mr-1"></i> Sincronizado
          </span>
          <span id="syncLoading" class="text-xs px-2 py-1 rounded-full bg-amber-100 text-amber-700 font-medium">
            <i class="fas fa-sync fa-spin mr-1"></i> Carregando...
          </span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="app.syncData()" class="text-slate-500 hover:text-blue-600 px-3 py-2 rounded-lg text-sm" title="Atualizar dados">
            <i class="fas fa-sync-alt"></i> Atualizar
          </button>
        </div>
      </header>
      <div id="content" class="flex-1 p-6 overflow-auto"></div>
    </main>
  </div>

  <!-- Modal Genérico -->
  <div id="genericModal" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
        <h3 id="modalTitle" class="font-semibold text-slate-800">Título</h3>
        <button onclick="app.closeModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div id="modalBody" class="p-5"></div>
      <div class="flex justify-end gap-2 px-5 py-4 border-t border-slate-100 bg-slate-50 rounded-b-xl">
        <button onclick="app.closeModal()" class="px-4 py-2 text-sm text-slate-600 hover:text-slate-800">Cancelar</button>
        <button id="modalSaveBtn" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300">
    <div class="bg-slate-800 text-white px-4 py-3 rounded-lg shadow-lg text-sm flex items-center gap-2">
      <i id="toastIcon" class="fas fa-info-circle"></i>
      <span id="toastMsg">Mensagem</span>
    </div>
  </div>

  <script src="assets/js/sheets-config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/modules/dashboard.js"></script>
  <script src="assets/js/modules/emprestimos.js"></script>
  <script src="assets/js/modules/estoque.js"></script>
  <script src="assets/js/modules/ferramentas.js"></script>
  <script src="assets/js/modules/relatorios.js"></script>
  <script src="assets/js/modules/historico.js"></script>
  <script src="assets/js/app.js"></script>
  
</body>
</html>
