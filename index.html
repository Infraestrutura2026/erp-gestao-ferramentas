<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Gestão de Ferramentas — Complexo Penal de Marília</title>
  <meta name="description" content="Sistema de Gestão de Ferramentas e Estoque da Polícia Penal">

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: { 850: '#1e293b' }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    @media print {
      #sidebar, header, #sidebar-overlay, #login-screen, button[onclick*="export"], button[onclick*="print"] { display: none !important; }
      #main-content { padding: 0 !important; }
    }

    /* Login screen background */
    .login-bg {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #1e293b 100%);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="login-bg fixed inset-0 z-[100] flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <!-- Card -->
      <div class="bg-white rounded-2xl shadow-2xl overflow-hidden fade-in">
        <!-- Header -->
        <div class="bg-slate-900 px-8 py-8 text-center relative">
          <div class="absolute top-0 left-0 w-full h-1 bg-amber-500"></div>
          <div class="w-16 h-16 rounded-xl bg-amber-500 flex items-center justify-center mx-auto mb-4 shadow-lg">
            <i class="fas fa-toolbox text-slate-900 text-2xl"></i>
          </div>
          <h1 class="text-xl font-bold text-white">Ferramentas & Estoque</h1>
          <p class="text-xs text-amber-400 uppercase tracking-wider mt-1 font-semibold">Complexo Penal de Marília</p>
          <p class="text-[10px] text-slate-400 mt-1">Polícia Penal — Núcleo de Infraestrutura e Logística</p>
        </div>

        <!-- Form -->
        <div class="px-8 py-6 space-y-4">
          <div id="login-error" class="hidden bg-red-50 border border-red-200 rounded-lg px-3 py-2 text-sm text-red-700 text-center"></div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Usuário</label>
            <div class="relative">
              <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input id="login-user" type="text" placeholder="Digite seu usuário"
                class="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition"
                onkeydown="if(event.key==='Enter')authModule.doLogin()">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Senha</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input id="login-pass" type="password" placeholder="Digite sua senha"
                class="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition"
                onkeydown="if(event.key==='Enter')authModule.doLogin()">
            </div>
          </div>

          <button onclick="authModule.doLogin()"
            class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold rounded-lg transition shadow-lg shadow-amber-500/20 text-sm">
            <i class="fas fa-sign-in-alt mr-2"></i>Entrar no Sistema
          </button>

          <div class="text-center">
            <button onclick="authModule.showPrimeiroAcesso()" class="text-xs text-slate-500 hover:text-amber-600 transition">
              Primeiro acesso? Criar conta
            </button>
          </div>
        </div>

        <!-- Footer -->
        <div class="bg-slate-50 px-8 py-3 border-t border-slate-200 text-center">
          <p class="text-[10px] text-slate-400">v2.3.0 · ZANONI & MARTINEZ InfraTech</p>
        </div>
      </div>

      <!-- Primeiro acesso (hidden by default) -->
      <div id="primeiro-acesso-card" class="hidden bg-white rounded-2xl shadow-2xl overflow-hidden mt-4 fade-in">
        <div class="px-8 py-6 space-y-4">
          <h3 class="text-sm font-bold text-slate-800 text-center">🆕 Criar Primeiro Usuário</h3>
          <div id="primeiro-error" class="hidden bg-red-50 border border-red-200 rounded-lg px-3 py-2 text-sm text-red-700 text-center"></div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Usuário</label>
            <input id="primeiro-user" type="text" placeholder="Crie um usuário"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Senha</label>
            <input id="primeiro-pass" type="password" placeholder="Crie uma senha"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Confirmar Senha</label>
            <input id="primeiro-pass2" type="password" placeholder="Repita a senha"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
          <button onclick="authModule.doPrimeiroAcesso()"
            class="w-full py-2 bg-blue-900 hover:bg-blue-800 text-white font-bold rounded-lg transition text-sm">
            <i class="fas fa-user-plus mr-2"></i>Criar e Entrar
          </button>
          <div class="text-center">
            <button onclick="authModule.hidePrimeiroAcesso()" class="text-xs text-slate-500 hover:text-slate-700 transition">
              ← Voltar ao login
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- APP CONTAINER -->
  <div id="app"></div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="estoque.js"></script>
  <script src="ferramentas.js"></script>
  <script src="indicadores.js"></script>
  <script src="app.js"></script>
</body>
</html>
